name: Software-Engineering-II
services:
  db:
    image: postgres
    container_name: SWE2-PostgreSQL

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: admin
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./seed/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./seed/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d admin"]
      interval: 5s
      timeout: 3s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: SWE2-adminer
    ports:
      - "8090:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
